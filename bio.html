<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Deus é Fiel - Links</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0f0f0f;
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            border-color: rgba(212, 175, 55, 0.5); /* Dourado */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .profile-glow {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }
        /* Animação de entrada suave */
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Container Principal -->
    <main class="w-full max-w-md mx-auto flex flex-col items-center">
        
        <!-- Cabeçalho / Perfil -->
        <div class="text-center mb-8 fade-in-up">
            <div class="relative w-32 h-32 mx-auto mb-4">
                <!-- Logo Image -->
                <div class="w-full h-full rounded-full bg-gradient-to-br from-gray-800 to-black flex items-center justify-center border-2 border-yellow-600 profile-glow overflow-hidden">
                    <img src="logobarabeariadeusefiel.jpg" alt="Logo Barbearia Deus é Fiel" class="w-full h-full object-cover">
                </div>
                <!-- Status (Aberto/Fechado - Estético) -->
                <div class="absolute bottom-1 right-1 bg-green-500 w-4 h-4 rounded-full border-2 border-gray-900" title="Online"></div>
            </div>
            
            <h1 class="text-2xl font-bold tracking-wide text-white mb-1">Barbearia Deus é Fiel</h1>
            <p class="text-gray-400 text-sm font-medium">Estilo, tradição e qualidade.</p>
        </div>

        <!-- Lista de Links -->
        <div class="w-full space-y-4">

            <!-- Botão Site Oficial -->
            <a href="https://barbeariadeusefiel.vercel.app/" target="_blank" class="glass-btn block w-full rounded-xl p-4 flex items-center justify-between group fade-in-up delay-100">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-yellow-600 flex items-center justify-center text-white group-hover:scale-110 transition-transform">
                        <i class="fas fa-globe text-lg"></i>
                    </div>
                    <div class="text-left">
                        <span class="block font-bold text-gray-100">Nosso Site</span>
                        <span class="text-xs text-gray-400">Agendamentos e Serviços</span>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-500 group-hover:text-yellow-500 transition-colors"></i>
            </a>

            <!-- Botão WhatsApp -->
            <a href="https://wa.me/5562991879022?text=Ol%C3%A1%2C%20gostaria%20de%20saber%20mais%20sobre%20os%20hor%C3%A1rios%20dispon%C3%ADveis." target="_blank" class="glass-btn block w-full rounded-xl p-4 flex items-center justify-between group fade-in-up delay-200">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-green-600 flex items-center justify-center text-white group-hover:scale-110 transition-transform">
                        <i class="fab fa-whatsapp text-xl"></i>
                    </div>
                    <div class="text-left">
                        <span class="block font-bold text-gray-100">Agendar no WhatsApp</span>
                        <span class="text-xs text-gray-400">Fale conosco agora</span>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-500 group-hover:text-green-500 transition-colors"></i>
            </a>

            <!-- Botão Instagram -->
            <a href="https://www.instagram.com/barbeariadeusefiel1901/" target="_blank" class="glass-btn block w-full rounded-xl p-4 flex items-center justify-between group fade-in-up delay-300">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-yellow-500 via-red-500 to-purple-600 flex items-center justify-center text-white group-hover:scale-110 transition-transform">
                        <i class="fab fa-instagram text-xl"></i>
                    </div>
                    <div class="text-left">
                        <span class="block font-bold text-gray-100">Instagram</span>
                        <span class="text-xs text-gray-400">Siga nosso perfil e cortes</span>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-500 group-hover:text-pink-500 transition-colors"></i>
            </a>

            <!-- Botão Localização -->
            <a href="https://maps.app.goo.gl/qo2NPUCxCr61YhCQ9?g_st=ipc" target="_blank" class="glass-btn block w-full rounded-xl p-4 flex items-center justify-between group fade-in-up delay-400">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white group-hover:scale-110 transition-transform">
                        <i class="fas fa-map-marker-alt text-lg"></i>
                    </div>
                    <div class="text-left">
                        <span class="block font-bold text-gray-100">Como Chegar</span>
                        <span class="text-xs text-gray-400">Ver localização no Maps</span>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-500 group-hover:text-blue-500 transition-colors"></i>
            </a>

        </div>

        <!-- Rodapé -->
        <footer class="mt-12 text-center text-gray-500 text-xs fade-in-up delay-500">
            <p class="mb-2">© 2024 Barbearia Deus é Fiel</p>
            <div class="flex gap-4 justify-center mt-4">
                <button onclick="sharePage()" class="flex items-center gap-2 px-4 py-2 bg-gray-800 rounded-full hover:bg-gray-700 transition">
                    <i class="fas fa-share-alt"></i> Compartilhar Cartão
                </button>
            </div>
        </footer>

    </main>

    <!-- Script para funcionalidade de compartilhar -->
    <script>
        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: 'Barbearia Deus é Fiel',
                    text: 'Agende seu horário e conheça a barbearia!',
                    url: window.location.href
                })
                .then(() => console.log('Compartilhado com sucesso'))
                .catch((error) => console.log('Erro ao compartilhar', error));
            } else {
                // Fallback para copiar link
                const dummy = document.createElement('input');
                document.body.appendChild(dummy);
                dummy.value = window.location.href;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                
                // Feedback visual simples
                const btn = document.querySelector('button');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check text-green-500"></i> Link Copiado!';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 2000);
            }
        }
    </script>
</body>
</html>
